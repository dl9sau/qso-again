plugins {
    id 'com.android.application'
}

def versionPropsFile = file('version.properties')
def versionBuild = 0
if (versionPropsFile.canRead()) {
    Properties versionProps = new Properties()
    versionProps.load(new FileInputStream(versionPropsFile))
    versionBuild = (versionProps['VERSION_BUILD'] ?: '0').toInteger()
}

def isBuildingApp = gradle.startParameter.taskNames.any { name ->
    def n = name.toLowerCase()
    n.contains('assemble') || n.contains('install') || n.contains('bundle') || n == 'build'
}
if (isBuildingApp) {
    versionBuild += 1
    Properties newVersionProps = new Properties()
    newVersionProps.setProperty('VERSION_BUILD', versionBuild.toString())
    versionPropsFile.withWriter { w -> newVersionProps.store(w, null) }
}

def buildTimestamp = new Date().format("yyyy-MM-dd HH:mm:ss")

android {
    namespace 'de.qso.again'
    compileSdk 34

    defaultConfig {
        applicationId "de.qso.again"
        minSdk 26
        targetSdk 34
        versionCode Math.max(1, versionBuild)
        versionName "1.0.${versionBuild}"
        buildConfigField "String", "BUILD_TIMESTAMP", "\"${buildTimestamp}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
