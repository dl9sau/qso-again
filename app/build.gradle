plugins {
    id 'com.android.application'
}

// Versionierung: Single Source of Truth ist 'app/version.properties'.
// Vorteil: shallow-clone-safe und gleiche Quelle fuer Gradle-Build und
// F-Droid checkupdates (UpdateCheckData zeigt auf dasselbe File).
def versionProps = new Properties()
file('version.properties').withInputStream { versionProps.load(it) }
def staticVersionName = versionProps.getProperty('versionName')
def staticVersionCode = versionProps.getProperty('versionCode').toInteger()

// CI-Suffix '-GIT-<shortHash>': nur fuer GitHub-Actions-Builds zur klaren
// Unterscheidung. F-Droid-Builds (CI=true, aber kein GITHUB_ACTIONS) bleiben
// ohne Suffix, damit versionName mit dem YAML-Build-Eintrag uebereinstimmt.
def shortHash = ''
try {
    shortHash = 'git rev-parse --short HEAD'.execute().text.trim()
} catch (Exception ignored) {}

def isGitHubActions = System.getenv('GITHUB_ACTIONS') != null
def versionSuffix = isGitHubActions ? "-GIT-${shortHash}" : ''

def buildTimestamp = new Date().format("yyyy-MM-dd HH:mm:ss")

android {
    namespace 'de.qso.again'
    compileSdk 34

    defaultConfig {
        applicationId "de.qso.again"
        minSdk 26
        targetSdk 34
        versionCode staticVersionCode
        versionName "${staticVersionName}${versionSuffix}"
        buildConfigField "String", "BUILD_TIMESTAMP", "\"${buildTimestamp}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "qso-again-${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
