plugins {
    id 'com.android.application'
}

// versionName: aus 'git describe --tags --always --dirty'
//   auf Tag:        1.0.0
//   zwischen Tags:  1.0.0-3-g3a1b   (3 Commits nach Tag, Kurzhash)
//   ohne Tag:       3a1b            (nur Hash)
//   uncommitted:    ...-dirty
// CI/F-Droid-Builds bekommen Suffix '-CI' fuer klare Unterscheidung.
def gitDescribe = '0.0.0-unknown'
try {
    gitDescribe = 'git describe --tags --always --dirty'.execute().text.trim()
} catch (Exception ignored) {}

// versionCode: deterministisch aus Tag-Name (X.Y.Z -> X*1M + Y*1K + Z).
// Vorteil: unabhaengig von Clone-Depth (F-Droid shallow-clone-safe) und
// stimmt deterministisch mit dem YAML-versionCode ueberein.
// Zwischen Tags greift der letzte erkannte Tag (gitDescribe-Prefix matcht
// auch "1.0.1-3-gABC").
def versionCodeFromTag = 1
def tagMatch = gitDescribe =~ /^v?(\d+)\.(\d+)\.(\d+)/
if (tagMatch) {
    versionCodeFromTag = (tagMatch[0][1] as Integer) * 1000000 +
                         (tagMatch[0][2] as Integer) * 1000 +
                         (tagMatch[0][3] as Integer)
}

// Kurz-Hash fuer CI-Suffix
def shortHash = ''
try {
    shortHash = 'git rev-parse --short HEAD'.execute().text.trim()
} catch (Exception ignored) {}

def isLocalBuild = !System.getenv('GITHUB_ACTIONS') && !System.getenv('CI')
def versionSuffix = isLocalBuild ? '' : "-GIT-${shortHash}"

def buildTimestamp = new Date().format("yyyy-MM-dd HH:mm:ss")

android {
    namespace 'de.qso.again'
    compileSdk 34

    defaultConfig {
        applicationId "de.qso.again"
        minSdk 26
        targetSdk 34
        versionCode versionCodeFromTag
        versionName "${gitDescribe}${versionSuffix}"
        buildConfigField "String", "BUILD_TIMESTAMP", "\"${buildTimestamp}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "qso-again-${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
