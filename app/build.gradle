plugins {
    id 'com.android.application'
}

// versionName: aus 'git describe --tags --always --dirty'
//   auf Tag:        1.0.0
//   zwischen Tags:  1.0.0-3-g3a1b   (3 Commits nach Tag, Kurzhash)
//   ohne Tag:       3a1b            (nur Hash)
//   uncommitted:    ...-dirty
// CI/F-Droid-Builds bekommen Suffix '-CI' fuer klare Unterscheidung.
def gitDescribe = '0.0.0-unknown'
try {
    gitDescribe = 'git describe --tags --always --dirty'.execute().text.trim()
} catch (Exception ignored) {}

// versionCode: Anzahl aller Commits = strikt monoton, ohne Pflege
def commitCount = 1
try {
    commitCount = ('git rev-list --count HEAD'.execute().text.trim()) as Integer
} catch (Exception ignored) {}

def isLocalBuild = !System.getenv('GITHUB_ACTIONS') && !System.getenv('CI')
def versionSuffix = isLocalBuild ? '' : '-CI'

def buildTimestamp = new Date().format("yyyy-MM-dd HH:mm:ss")

android {
    namespace 'de.qso.again'
    compileSdk 34

    defaultConfig {
        applicationId "de.qso.again"
        minSdk 26
        targetSdk 34
        versionCode commitCount
        versionName "${gitDescribe}${versionSuffix}"
        buildConfigField "String", "BUILD_TIMESTAMP", "\"${buildTimestamp}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
